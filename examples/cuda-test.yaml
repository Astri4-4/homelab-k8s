# Test GPU manuel (hors ArgoCD) :
#   kubectl apply -f examples/cuda-test.yaml && kubectl logs -f cuda-test-sergay
# Doit finir par "Test PASSED". Supprimer ensuite : kubectl delete -f examples/cuda-test.yaml
apiVersion: v1
kind: Pod
metadata:
  name: cuda-test-sergay
spec:
  restartPolicy: OnFailure
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: talosnode1
  containers:
    - name: cuda
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
      resources:
        limits:
          nvidia.com/gpu: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: cuda-test-kalinka
spec:
  restartPolicy: OnFailure
  runtimeClassName: nvidia
  nodeSelector:
    kubernetes.io/hostname: talosmaster
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  containers:
    - name: cuda
      image: nvcr.io/nvidia/k8s/cuda-sample:vectoradd-cuda12.5.0
      resources:
        limits:
          nvidia.com/gpu: 1
