# Patch machine config commun aux deux nœuds GPU (kalinka + sergay)
# talosctl -n <ip> patch mc --patch @talos/patches/nvidia-gpu.yaml
# Label du device plugin posé à part (conflit machine.nodeLabels sous Talos 1.14) :
#   kubectl label node <node> nvidia.com/gpu.present=true
machine:
  kernel:
    modules:
      - name: nvidia
      - name: nvidia_uvm
      - name: nvidia_drm
      - name: nvidia_modeset
  sysctls:
    # requis par nvidia-container-cli (programmes BPF)
    net.core.bpf_jit_harden: 1
