apiVersion: v1
kind: Namespace
metadata:
  name: ai
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 60Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: ollama }
  template:
    metadata:
      labels: { app: ollama }
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
        kubernetes.io/hostname: talosnode1
      containers:
        - name: ollama
          image: ollama/ollama:0.34.4
          ports:
            - containerPort: 11434
          env:
            - { name: OLLAMA_HOST, value: "0.0.0.0:11434" }
            - { name: OLLAMA_CONTEXT_LENGTH, value: "8192" }
            - { name: OLLAMA_FLASH_ATTENTION, value: "1" }
            - { name: OLLAMA_KV_CACHE_TYPE, value: "q8_0" }
            - { name: OLLAMA_KEEP_ALIVE, value: "30m" }
            - { name: OLLAMA_MAX_LOADED_MODELS, value: "1" }
            - { name: OLLAMA_NUM_PARALLEL, value: "1" }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits:
              memory: 8Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: models, mountPath: /root/.ollama }
          readinessProbe:
            httpGet: { path: /, port: 11434 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 11434 }
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: models
          persistentVolumeClaim: { claimName: ollama-models }
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: ai
spec:
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
---
# API Ollama LAN/WireGuard uniquement, sans auth : NE PAS publier dans le tunnel
apiVersion: v1
kind: Service
metadata:
  name: ollama-lan
  namespace: ai
spec:
  type: NodePort
  selector: { app: ollama }
  ports:
    - port: 11434
      targetPort: 11434
      nodePort: 31434
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: ai
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: ai
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: open-webui }
  template:
    metadata:
      labels: { app: open-webui }
    spec:
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.11.4
          ports:
            - containerPort: 8080
          env:
            - { name: OLLAMA_BASE_URL, value: "http://ollama.ai.svc.cluster.local:11434" }
            - { name: WEBUI_URL, value: "https://ai.sachaguerin.fr" }
            - { name: ENABLE_OPENAI_API, value: "false" }
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: open-webui-secret, key: WEBUI_SECRET_KEY }
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /app/backend/data }
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: open-webui-data }
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: ai
spec:
  selector: { app: open-webui }
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: open-webui
  namespace: ai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [ai.sachaguerin.fr]
      secretName: ai-sachaguerin-tls
  rules:
    - host: ai.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: open-webui, port: { number: 80 } }
