apiVersion: v1
kind: Namespace
metadata:
  name: wallos
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallos-db
  namespace: wallos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallos-logos
  namespace: wallos
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallos
  namespace: wallos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wallos
  template:
    metadata:
      labels:
        app: wallos
    spec:
      nodeSelector:
        kubernetes.io/hostname: talosnode1
      containers:
        - name: wallos
          image: bellamy/wallos:latest
          ports:
            - containerPort: 80
          env:
            - name: TZ
              value: Europe/Paris
          volumeMounts:
            - name: db
              mountPath: /var/www/html/db
            - name: logos
              mountPath: /var/www/html/images/uploads/logos
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: wallos-db
        - name: logos
          persistentVolumeClaim:
            claimName: wallos-logos
---
apiVersion: v1
kind: Service
metadata:
  name: wallos
  namespace: wallos
spec:
  selector:
    app: wallos
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallos
  namespace: wallos
spec:
  ingressClassName: traefik
  rules:
    - host: wallos.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallos
                port:
                  number: 80