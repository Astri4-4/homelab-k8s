apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-db
  namespace: firefly
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: firefly-upload
  namespace: firefly
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: firefly-db
  namespace: firefly
spec:
  serviceName: firefly-db
  replicas: 1
  selector:
    matchLabels:
      app: firefly-db
  template:
    metadata:
      labels:
        app: firefly-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: talosnode1
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: firefly
            - name: POSTGRES_USER
              value: firefly
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: firefly-db
---
apiVersion: v1
kind: Service
metadata:
  name: firefly-db
  namespace: firefly
spec:
  selector:
    app: firefly-db
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefly
  namespace: firefly
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: firefly
  template:
    metadata:
      labels:
        app: firefly
    spec:
      nodeSelector:
        kubernetes.io/hostname: talosnode1
      containers:
        - name: firefly
          image: fireflyiii/core:latest
          ports:
            - containerPort: 8080
          env:
            - name: APP_URL
              value: https://firefly.home.sachaguerin.fr
            - name: TRUSTED_PROXIES
              value: "**"
            - name: TZ
              value: Europe/Paris
            - name: DEFAULT_LANGUAGE
              value: fr_FR
            - name: DEFAULT_LOCALE
              value: fr_FR
            - name: DB_CONNECTION
              value: pgsql
            - name: DB_HOST
              value: firefly-db
            - name: DB_PORT
              value: "5432"
            - name: DB_DATABASE
              value: firefly
            - name: DB_USERNAME
              value: firefly
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: firefly-secrets
                  key: DB_PASSWORD
            - name: APP_KEY
              valueFrom:
                secretKeyRef:
                  name: firefly-secrets
                  key: APP_KEY
            - name: STATIC_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: firefly-secrets
                  key: STATIC_CRON_TOKEN
          volumeMounts:
            - name: upload
              mountPath: /var/www/html/storage/upload
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
      volumes:
        - name: upload
          persistentVolumeClaim:
            claimName: firefly-upload
---
apiVersion: v1
kind: Service
metadata:
  name: firefly
  namespace: firefly
spec:
  selector:
    app: firefly
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firefly
  namespace: firefly
spec:
  ingressClassName: traefik
  rules:
    - host: firefly.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firefly
                port:
                  number: 8080
---
# Génère les transactions récurrentes et les rappels de factures
apiVersion: batch/v1
kind: CronJob
metadata:
  name: firefly-cron
  namespace: firefly
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: cron
              image: curlimages/curl:latest
              env:
                - name: TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: firefly-secrets
                      key: STATIC_CRON_TOKEN
              command: ["sh", "-c", "curl -fsS http://firefly.firefly.svc:8080/api/v1/cron/$TOKEN"]