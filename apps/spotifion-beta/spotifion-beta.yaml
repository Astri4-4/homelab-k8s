# Instance beta de Spotifion : pour tester une pre-release (tag vX.Y.Z-beta.N)
# sans toucher la prod (apps/spotifion). Même image, son propre serveur Jam
# et ses propres données (Mixes, photos, invitations) ; même Navidrome, donc
# les likes et playlists modifiés ici le sont pour de vrai.
#
# Nouvelle beta : changer le tag de l'image ci-dessous (le pod est remplacé
# tout seul). Seuls les tags de version sont poussés sur GHCR (et main en
# :latest), pas les branches.
apiVersion: v1
kind: Namespace
metadata:
  name: spotifion-beta
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotifion-beta
  namespace: spotifion-beta
  labels:
    app: spotifion-beta
spec:
  # Jam sessions vivent en mémoire : 1 seul pod, Recreate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spotifion-beta
  template:
    metadata:
      labels:
        app: spotifion-beta
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        # Copié depuis spotifion (une fois) :
        #   kubectl get secret ghcr -n spotifion -o json \
        #     | jq ".metadata = {name: \"ghcr\", namespace: \"spotifion-beta\"}" | kubectl apply -f -
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # Rend le volume de données (Longhorn, créé en root) inscriptible par l'uid 101.
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spotifion
          # La beta à tester : ghcr.io/astri4-4/spotifiak:<version sans le v>
          image: ghcr.io/astri4-4/spotifiak:0.11.0-1b
          imagePullPolicy: IfNotPresent
          env:
            - { name: NAVIDROME_URL, value: "http://navidrome.media.svc.cluster.local:4533" }
            - { name: DEEMIX_URL, value: "http://deemix.media.svc.cluster.local:6595" }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /jam-api/healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            # Mixes, photos de profil, invitations, doublons masqués (data.yaml)
            - { name: data, mountPath: /opt/jam/data }
      volumes:
        - { name: nginx-conf, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
        - { name: data, persistentVolumeClaim: { claimName: spotifion-beta-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: spotifion-beta
  namespace: spotifion-beta
spec:
  selector:
    app: spotifion-beta
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotifion-beta
  namespace: spotifion-beta
spec:
  ingressClassName: traefik
  rules:
    - host: spotifion-beta.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: spotifion-beta, port: { number: 8080 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotifion-beta-public
  namespace: spotifion-beta
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # SSE (Jam) + streams audio : pas de buffering, timeouts longs
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [spotifion-beta.sachaguerin.fr]
      secretName: spotifion-beta-tls
  rules:
    - host: spotifion-beta.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: spotifion-beta, port: { number: 8080 } }
