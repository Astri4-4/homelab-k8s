apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-graph-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  n8n-graph.json: |-
    {
      "uid": "n8n-graph",
      "title": "n8n graph (template)",
      "tags": [
        "n8n"
      ],
      "schemaVersion": 39,
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "ds",
            "type": "datasource",
            "query": "prometheus",
            "hide": 2
          },
          {
            "name": "promql",
            "type": "textbox",
            "query": "up",
            "hide": 2,
            "current": {
              "text": "up",
              "value": "up"
            }
          },
          {
            "name": "titre",
            "type": "textbox",
            "query": "Graphique",
            "hide": 2,
            "current": {
              "text": "Graphique",
              "value": "Graphique"
            }
          },
          {
            "name": "legende",
            "type": "textbox",
            "query": "__auto",
            "hide": 2,
            "current": {
              "text": "__auto",
              "value": "__auto"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "${titre}",
          "datasource": {
            "type": "prometheus",
            "uid": "${ds}"
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "${ds}"
              },
              "expr": "${promql}",
              "legendFormat": "${legende}",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "line",
                "lineWidth": 2,
                "fillOpacity": 18,
                "gradientMode": "opacity",
                "showPoints": "never",
                "lineInterpolation": "smooth"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true,
              "calcs": [
                "lastNotNull",
                "max",
                "mean"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
