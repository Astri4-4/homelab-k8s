apiVersion: v1
kind: Namespace
metadata:
  name: backup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: restic-truenas
  namespace: backup
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: restic
              image: restic/restic:0.17.3
              envFrom:
                - secretRef:
                    name: restic-hetzner
              env:
                - name: RESTIC_CACHE_DIR
                  value: /cache
                - name: RESTIC_PROGRESS_FPS
                  value: "0.0167"   # environ une ligne de progression par minute
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -e
                  restic cat config >/dev/null 2>&1 || restic init
                  restic backup /data --host truenas --tag nightly \
                    --exclude '**/.recycle' --exclude '**/@eaDir'
                  restic forget --host truenas --keep-daily 7 --keep-weekly 4 --keep-monthly 6 --prune
                  restic check --read-data-subset=5%
              volumeMounts:
                - { name: ssh, mountPath: /root/.ssh, readOnly: true }
                - { name: cache, mountPath: /cache }
                - { name: music, mountPath: /data/music, readOnly: true }
                - { name: nc, mountPath: /data/nc, readOnly: true }
              resources:
                requests: { cpu: 200m, memory: 256Mi }
                limits:   { memory: 1Gi }
          volumes:
            - name: ssh
              secret:
                secretName: restic-hetzner
                defaultMode: 0400
                items:
                  - { key: id_ed25519, path: id_ed25519 }
                  - { key: config, path: config }
            - name: cache
              emptyDir: {}
            # Un volume NFS par partage à sauvegarder
            - name: music
              nfs: { server: 192.168.10.33, path: /mnt/Storage/Musique, readOnly: true }
            - name: nc
              nfs: { server: 192.168.10.33, path: /mnt/Storage/nextcloud, readOnly: true }
