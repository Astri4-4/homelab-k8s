apiVersion: v1
kind: Namespace
metadata:
  name: spotifion
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotifion
  namespace: spotifion
  labels:
    app: spotifion
spec:
  # Jam sessions vivent en mémoire : 1 seul pod, Recreate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spotifion
  template:
    metadata:
      labels:
        app: spotifion
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spotifion
          image: ghcr.io/astri4-4/spotifiak:latest
          imagePullPolicy: Always
          env:
            # nginx proxifie /rest/ côté serveur -> Service interne de Navidrome
            - { name: NAVIDROME_URL, value: "http://navidrome.media.svc.cluster.local:4533" }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /jam-api/healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: nginx-conf, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: spotifion
  namespace: spotifion
spec:
  selector:
    app: spotifion
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotifion
  namespace: spotifion
spec:
  ingressClassName: traefik
  rules:
    - host: spotifion.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: spotifion, port: { number: 8080 } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotifion-public
  namespace: spotifion
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    # SSE (Jam) + streams audio : pas de buffering, timeouts longs
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [spotifion.sachaguerin.fr]
      secretName: spotifion-tls
  rules:
    - host: spotifion.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: spotifion, port: { number: 8080 } }