apiVersion: v1
kind: Namespace
metadata:
  name: spotifion
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotifion
  namespace: spotifion
  labels:
    app: spotifion
spec:
  # Jam sessions vivent en mémoire : 1 seul pod, Recreate.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: spotifion
  template:
    metadata:
      labels:
        app: spotifion
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        # Rend le volume de données (Longhorn, créé en root) inscriptible
        # par l'uid 101. Le partage SMB n'est pas touché : le driver SMB
        # n'applique fsGroup qu'aux volumes ReadWriteOnce.
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spotifion
          image: ghcr.io/astri4-4/spotifiak:latest
          imagePullPolicy: Always
          env:
            # nginx proxifie /rest/ côté serveur -> Service interne de Navidrome
            - { name: NAVIDROME_URL, value: "http://navidrome.media.svc.cluster.local:4533" }
            - { name: DEEMIX_URL, value: "http://deemix.media.svc.cluster.local:6595"}
            # "Supprimer les doublons" : partage Musique en écriture (music.yaml)
            - { name: MUSIC_DIR, value: /music }
            # Dossier de deemix dans le partage (son subPath) : ses singles sont à sa racine
            - { name: DEEMIX_FOLDER, value: Deezer }
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /jam-api/healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d }
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: music, mountPath: /music }
            # Mixes, photos de profil + réglage Discover (data.yaml)
            - { name: data, mountPath: /opt/jam/data }
      volumes:
        - { name: nginx-conf, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: nginx-cache, emptyDir: {} }
        - { name: music, persistentVolumeClaim: { claimName: music } }
        - { name: data, persistentVolumeClaim: { claimName: spotifion-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: spotifion
  namespace: spotifion
spec:
  selector:
    app: spotifion
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spotifion
  namespace: spotifion
spec:
  ingressClassName: traefik
  rules:
    - host: spotifion.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: spotifion, port: { number: 8080 } }
