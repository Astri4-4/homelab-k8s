# Seerr — demandes de films/séries (Jellyfin + Radarr/Sonarr), NodePort 30555
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: seerr-config, namespace: media }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: seerr, namespace: media }
spec:
  replicas: 1
  strategy: { type: Recreate }        # PVC RWO : pas de double pod
  selector: { matchLabels: { app: seerr } }
  template:
    metadata: { labels: { app: seerr } }
    spec:
      nodeSelector: { kubernetes.io/hostname: talosnode1 }
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                 # /app/config doit appartenir à 1000:1000
      containers:
        - name: seerr
          image: ghcr.io/seerr-team/seerr:latest
          env:
            - { name: TZ, value: Europe/Paris }
            - { name: LOG_LEVEL, value: info }
            - { name: PORT, value: "5055" }
          ports: [{ name: http, containerPort: 5055 }]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /api/v1/settings/public, port: 5055 }
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /api/v1/settings/public, port: 5055 }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /app/config }
      volumes:
        - { name: config, persistentVolumeClaim: { claimName: seerr-config } }
---
apiVersion: v1
kind: Service
metadata: { name: seerr, namespace: media }
spec:
  type: NodePort
  selector: { app: seerr }
  ports: [{ name: http, port: 5055, targetPort: 5055, nodePort: 30555 }]