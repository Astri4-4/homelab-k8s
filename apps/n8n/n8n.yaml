---
apiVersion: v1
kind: Namespace
metadata:
  name: n8n
---
# ---------- PostgreSQL ----------
apiVersion: v1
kind: Service
metadata:
  name: n8n-postgres
  namespace: n8n
spec:
  clusterIP: None
  selector:
    app: n8n-postgres
  ports:
    - port: 5432
      name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: n8n-postgres
  namespace: n8n
spec:
  serviceName: n8n-postgres
  replicas: 1
  selector:
    matchLabels:
      app: n8n-postgres
  template:
    metadata:
      labels:
        app: n8n-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: n8n
            - name: POSTGRES_USER
              value: n8n
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: DB_PASSWORD
            - name: PGDATA   # sous-dossier : évite le lost+found du volume Longhorn
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "n8n", "-d", "n8n"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "n8n", "-d", "n8n"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
---
# ---------- n8n ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-data
  namespace: n8n
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
spec:
  replicas: 1
  strategy:
    type: Recreate   # PVC RWO
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      serviceAccountName: n8n-agent
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        - name: install-kubectl
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              V=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
              curl -fsSL -o /opt/kubectl/kubectl "https://dl.k8s.io/release/${V}/bin/linux/amd64/kubectl"
              chmod +x /opt/kubectl/kubectl
          volumeMounts:
            - name: kubectl
              mountPath: /opt/kubectl
        - name: wait-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h n8n-postgres -U n8n; do sleep 2; done"]
      containers:
        - name: n8n
          image: docker.n8n.io/n8nio/n8n:stable   # à pinner sur une version précise
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: DB_TYPE
              value: postgresdb
            - name: DB_POSTGRESDB_HOST
              value: n8n-postgres
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: n8n
            - name: DB_POSTGRESDB_USER
              value: n8n
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: DB_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-secrets
                  key: N8N_ENCRYPTION_KEY
            - name: N8N_HOST
              value: n8n.home.sachaguerin.fr
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: http          # passe à https si Traefik a un cert pour *.home
            - name: WEBHOOK_URL
              value: http://n8n.home.sachaguerin.fr/
            - name: N8N_SECURE_COOKIE
              value: "false"       # à retirer si https
            - name: N8N_PROXY_HOPS
              value: "1"           # derrière Traefik
            - name: GENERIC_TIMEZONE
              value: Europe/Paris
            - name: TZ
              value: Europe/Paris
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: EXECUTIONS_DATA_PRUNE
              value: "true"
            - name: EXECUTIONS_DATA_MAX_AGE
              value: "336"         # 14 jours
            - name: NODES_EXCLUDE  # n8n 2.x désactive "Execute Command" par défaut
              value: "[]"
            - name: N8N_RESTRICT_FILE_ACCESS_TO
              value: "/files"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: kubectl
              mountPath: /opt/kubectl
              readOnly: true
            - name: agent-files
              mountPath: /files
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: kubectl
          emptyDir: {}
        - name: agent-files
          persistentVolumeClaim:
            claimName: n8n-agent-files
---
apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: n8n
spec:
  selector:
    app: n8n
  ports:
    - port: 5678
      targetPort: 5678
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: n8n
  namespace: n8n
spec:
  ingressClassName: traefik
  rules:
    - host: n8n.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: n8n
                port:
                  number: 5678
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-agent-files
  namespace: n8n
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi