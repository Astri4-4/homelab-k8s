# ServiceAccount utilisé par le pod n8n -> kubectl in-cluster
apiVersion: v1
kind: ServiceAccount
metadata:
  name: n8n-agent
  namespace: n8n
---
# Lecture seule sur tout le cluster (rôle intégré "view" : pas d'accès aux Secrets)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: n8n-agent-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: ServiceAccount
    name: n8n-agent
    namespace: n8n
---
# Actions "ops" limitées : rollout restart, scale, suppression de pods, top
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: n8n-agent-ops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale", "statefulsets/scale"]
    verbs: ["patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: n8n-agent-ops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: n8n-agent-ops
subjects:
  - kind: ServiceAccount
    name: n8n-agent
    namespace: n8n