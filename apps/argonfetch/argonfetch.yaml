apiVersion: v1
kind: Namespace
metadata:
  name: argonfetch
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: argonfetch-tools
  namespace: argonfetch
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argonfetch
  namespace: argonfetch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: argonfetch
  template:
    metadata:
      labels:
        app: argonfetch
    spec:
      containers:
        - name: argonfetch
          image: ghcr.io/argonfetch/argonfetch:latest
          ports:
            - containerPort: 8080
          env:
            - { name: CORS_ALLOWED_ORIGINS, value: "https://argonfetch.home.sachaguerin.fr,http://argonfetch.home.sachaguerin.fr" }
            - { name: TZ, value: Europe/Paris }
            - { name: Plugins__Repositories__0, value: "https://raw.githubusercontent.com/ArgonFetch/ArgonFetchPlugins/repo/index.json" }
            - { name: Plugins__Install__0, value: "spotify" }
          volumeMounts:
            - { name: tools, mountPath: /tools }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }
      volumes:
        - name: tools
          persistentVolumeClaim: { claimName: argonfetch-tools }
---
apiVersion: v1
kind: Service
metadata:
  name: argonfetch
  namespace: argonfetch
spec:
  selector:
    app: argonfetch
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argonfetch
  namespace: argonfetch
spec:
  ingressClassName: traefik
  rules:
    - host: argonfetch.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argonfetch
                port: { number: 8080 }
