# Immich v3.2.4 — server + machine-learning (CUDA, RTX 4060) + PostgreSQL (VectorChord) + Valkey
# Secret à créer à la main AVANT le premier sync :
#   kubectl create namespace immich
#   kubectl -n immich create secret generic immich-db --from-literal=password="$(openssl rand -hex 24)"
#   kubectl -n immich create secret generic smb-immich --from-literal=username='<user SMB>' --from-literal=password='<mdp>'
# Photos/vidéos sur le NAS (SMB), Postgres + cache ML sur Longhorn (jamais de BDD sur SMB).
---
apiVersion: v1
kind: Namespace
metadata:
  name: immich
---
# ---------- Stockage ----------
# Bibliothèque photos sur le NAS : partage SMB TrueNAS "Immich" (PV statique csi-driver-smb)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-immich-library
spec:
  capacity:
    storage: 1Ti              # indicatif, SMB ne l'applique pas
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain   # supprimer PV/PVC ne touche jamais aux fichiers du NAS
  storageClassName: ""
  mountOptions:
    - dir_mode=0775
    - file_mode=0664
    - uid=1000
    - gid=1000
    - noperm
    - mfsymlinks
    - noserverino
    - cache=strict
    - vers=3.1.1
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: 192.168.10.33/Immich##immich
    volumeAttributes:
      source: //192.168.10.33/Immich
    nodeStageSecretRef:
      name: smb-immich
      namespace: immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-library-nas
  namespace: immich
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: pv-immich-library
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: immich-icloud-smb
spec:
  capacity:
    storage: 1Ti
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - dir_mode=0775
    - file_mode=0664
    - uid=1000
    - gid=1000
    - noperm
    - mfsymlinks
    - noserverino
    - cache=strict
    - vers=3.1.1
  csi:
    driver: smb.csi.k8s.io
    volumeHandle: 192.168.10.33/Immich/icloud##immich-icloud
    volumeAttributes:
      source: //192.168.10.33/Immich
      subDir: icloud
    nodeStageSecretRef:
      name: smb-immich
      namespace: immich
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: icloud-photos
  namespace: immich
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: immich-icloud-smb
  resources:
    requests:
      storage: 1Ti
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-postgres
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: immich-ml-cache
  namespace: immich
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi           # modèles CLIP / reconnaissance faciale
---
# ---------- Config commune ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: immich-env
  namespace: immich
data:
  TZ: Europe/Paris
  DB_HOSTNAME: immich-postgres
  DB_USERNAME: immich
  DB_DATABASE_NAME: immich
  REDIS_HOSTNAME: immich-valkey
  IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
---
# ---------- PostgreSQL (image Immich avec VectorChord) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: immich-postgres }
  template:
    metadata:
      labels: { app: immich-postgres }
    spec:
      nodeSelector:
        kubernetes.io/hostname: talosnode1
      containers:
        - name: postgres
          image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: immich
            - name: POSTGRES_DB
              value: immich
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: immich-db, key: password }
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: PGDATA            # sous-dossier : évite le lost+found du volume ext4
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "immich", "-d", "immich"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: shm, mountPath: /dev/shm }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: immich-postgres }
        - name: shm
          emptyDir: { medium: Memory, sizeLimit: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: immich
spec:
  selector: { app: immich-postgres }
  ports:
    - port: 5432
      targetPort: 5432
---
# ---------- Valkey ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-valkey
  namespace: immich
spec:
  replicas: 1
  selector:
    matchLabels: { app: immich-valkey }
  template:
    metadata:
      labels: { app: immich-valkey }
    spec:
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-valkey
  namespace: immich
spec:
  selector: { app: immich-valkey }
  ports:
    - port: 6379
      targetPort: 6379
---
# ---------- Machine learning (CUDA, RTX 4060 en time-slicing) ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: immich-machine-learning }
  template:
    metadata:
      labels: { app: immich-machine-learning }
    spec:
      nodeSelector:
        kubernetes.io/hostname: talosnode1
      runtimeClassName: nvidia
      containers:
        - name: machine-learning
          image: ghcr.io/immich-app/immich-machine-learning:v3.2.4-cuda
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef: { name: immich-env }
          env:
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: /cache
            - name: MACHINE_LEARNING_MODEL_TTL     # décharge les modèles de la VRAM après 5 min d'inactivité
              value: "300"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: compute,utility
          readinessProbe:
            httpGet: { path: /ping, port: 3003 }
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 1Gi }
            limits:
              memory: 10Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - { name: cache, mountPath: /cache }
      volumes:
        - name: cache
          persistentVolumeClaim: { claimName: immich-ml-cache }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-machine-learning
  namespace: immich
spec:
  selector: { app: immich-machine-learning }
  ports:
    - port: 3003
      targetPort: 3003
---
# ---------- Server ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-server
  namespace: immich
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: immich-server }
  template:
    metadata:
      labels: { app: immich-server }
    spec:
      nodeSelector:
        kubernetes.io/hostname: talosnode1
      containers:
        - name: server
          image: ghcr.io/immich-app/immich-server:v3.2.4
          ports:
            - containerPort: 2283
          envFrom:
            - configMapRef: { name: immich-env }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: immich-db, key: password }
          readinessProbe:
            httpGet: { path: /api/server/ping, port: 2283 }
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet: { path: /api/server/ping, port: 2283 }
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 4Gi }
          volumeMounts:
            - { name: library, mountPath: /data }
            - { name: icloud, mountPath: /mnt/icloud, readOnly: true }
      volumes:
        - name: library
          persistentVolumeClaim: { claimName: immich-library-nas }
        - name: icloud
          persistentVolumeClaim: { claimName: icloud-photos }
---
apiVersion: v1
kind: Service
metadata:
  name: immich-server
  namespace: immich
spec:
  selector: { app: immich-server }
  ports:
    - port: 80
      targetPort: 2283
---
# ---------- Exposition publique (cloudflared -> ingress-nginx) ----------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  namespace: immich
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [immich.sachaguerin.fr]
      secretName: immich-tls
  rules:
    - host: immich.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: immich-server, port: { number: 80 } }
---
# ---------- Accès LAN (Traefik) : contourne la limite d'upload 100 Mo de Cloudflare ----------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich-lan
  namespace: immich
spec:
  ingressClassName: traefik
  rules:
    - host: immich.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: immich-server, port: { number: 80 } }