apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: navidrome
          image: deluan/navidrome:latest
          ports:
            - containerPort: 4533
          env:
            - { name: ND_MUSICFOLDER, value: /music }
            - { name: ND_DATAFOLDER, value: /data }
            - { name: ND_SCANSCHEDULE, value: "1h" }
            - { name: ND_LOGLEVEL, value: info }
            - { name: ND_LISTENBRAINZ_ENABLED, value: "true" }
            - { name: TZ, value: Europe/Paris }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: music, mountPath: /music, readOnly: true }
          readinessProbe:
            httpGet: { path: /ping, port: 4533 }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: navidrome-data }
        - name: music
          persistentVolumeClaim: { claimName: music }
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: media
spec:
  selector:
    app: navidrome
  ports:
    - port: 4533
      targetPort: 4533
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome
  namespace: media
spec:
  ingressClassName: traefik
  rules:
    - host: navidrome.home.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: navidrome
                port: { number: 4533 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-public
  namespace: media
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [navidrome.sachaguerin.fr]
      secretName: navidrome-tls
  rules:
    - host: navidrome.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: navidrome, port: { number: 4533 } }