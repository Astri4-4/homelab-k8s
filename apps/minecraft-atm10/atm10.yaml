apiVersion: v1
kind: Namespace
metadata:
  name: minecraft
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atm10-data
  namespace: minecraft
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 30Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atm10
  namespace: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: atm10
  template:
    metadata:
      labels:
        app: atm10
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        fsGroup: 1000
      containers:
        - name: mc
          image: ghcr.io/astri4-4/atm10:8.1
          imagePullPolicy: Always
          stdin: true
          tty: true
          env:
            - name: MEMORY
              value: 10G
            - name: TZ
              value: Europe/Paris
            - name: JAVA_OPTS
              value: >-
                -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200
                -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch
                -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M
                -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4
                -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90
                -XX:G1RSetUpdatingPauseTimePercent=5 -XX:SurvivorRatio=32
                -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1
          ports:
            - name: minecraft
              containerPort: 25565
          resources:
            requests:
              cpu: "2"
              memory: 12Gi
            limits:
              memory: 13Gi
          startupProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            tcpSocket:
              port: 25565
            periodSeconds: 30
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atm10-data
---
apiVersion: v1
kind: Service
metadata:
  name: atm10
  namespace: minecraft
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: atm10
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      nodePort: 30565
