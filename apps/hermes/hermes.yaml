apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-data
  namespace: hermes
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes
  namespace: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate          # never 2 gateways on the same /opt/data
  selector:
    matchLabels: { app: hermes }
  template:
    metadata:
      labels: { app: hermes }
    spec:
      # no securityContext.runAsUser: s6 /init must start as root, then drops to UID 10000
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:latest   # pin a X.Y.Z tag once it works
          args: ["gateway", "run"]
          env:
            - name: HERMES_DASHBOARD
              value: "1"
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
          envFrom:
            - secretRef:
                name: hermes-dashboard-auth
          ports:
            - { name: dashboard, containerPort: 9119 }
            - { name: api, containerPort: 8642 }
          volumeMounts:
            - { name: data, mountPath: /opt/data }
            - { name: dshm, mountPath: /dev/shm }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits:   { cpu: "2",  memory: 4Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: dshm              # Chromium/browser tools need shm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: hermes
  namespace: hermes
spec:
  type: NodePort
  selector: { app: hermes }
  ports:
    - name: dashboard
      port: 9119
      targetPort: 9119
      nodePort: 31919
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-api
  namespace: hermes
spec:
  type: ClusterIP
  selector: { app: hermes }
  ports:
    - name: api
      port: 8642
      targetPort: 8642
