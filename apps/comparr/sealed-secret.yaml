# Généré avec kubeseal. Pour modifier une valeur (ex. webhook Discord) :
#   echo -n '<valeur>' | kubeseal --raw --namespace comparr --name comparr-secrets
# puis remplacer la clé correspondante dans encryptedData.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: comparr-secrets
  namespace: comparr
spec:
  encryptedData:
    BETTER_AUTH_ALLOWED_EMAILS: 
    BETTER_AUTH_SECRET: 
    DATABASE_URL: 
    DISCORD_ADMIN_WEBHOOK_URL: 
    POSTGRES_PASSWORD: 
  template:
    metadata:
      name: comparr-secrets
      namespace: comparr
