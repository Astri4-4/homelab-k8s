apiVersion: v1
kind: Namespace
metadata:
  name: gitea
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gitea-data
  namespace: gitea
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: gitea }
  template:
    metadata:
      labels: { app: gitea }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: gitea
          image: gitea/gitea:1.26-rootless
          ports:
            - { name: http, containerPort: 3000 }
            - { name: ssh, containerPort: 2222 }
          env:
            - { name: GITEA__database__DB_TYPE, value: sqlite3 }
            - { name: GITEA__database__PATH, value: /var/lib/gitea/data/gitea.db }
            - { name: GITEA__server__DOMAIN, value: git.sachaguerin.fr }
            - { name: GITEA__server__ROOT_URL, value: https://git.sachaguerin.fr/ }
            - { name: GITEA__server__HTTP_PORT, value: "3000" }
            - { name: GITEA__server__SSH_DOMAIN, value: git.home.sachaguerin.fr }
            - { name: GITEA__server__SSH_PORT, value: "30022" }
            - { name: GITEA__server__SSH_LISTEN_PORT, value: "2222" }
            - { name: GITEA__server__START_SSH_SERVER, value: "true" }
            - { name: GITEA__server__LFS_START_SERVER, value: "true" }
            - { name: GITEA__security__INSTALL_LOCK, value: "true" }
            - { name: GITEA__service__DISABLE_REGISTRATION, value: "true" }
            - { name: GITEA__service__REQUIRE_SIGNIN_VIEW, value: "false" }
            - { name: GITEA__webhook__ALLOWED_HOST_LIST, value: "private,external" }
            - { name: GITEA__mailer__ENABLED, value: "false" }
            - { name: GITEA__log__LEVEL, value: Info }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/healthz, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - { name: data, mountPath: /var/lib/gitea, subPath: data }
            - { name: data, mountPath: /etc/gitea, subPath: config }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: gitea-data }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: gitea
spec:
  selector: { app: gitea }
  ports:
    - { name: http, port: 80, targetPort: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: gitea-ssh
  namespace: gitea
spec:
  type: NodePort
  selector: { app: gitea }
  ports:
    - { name: ssh, port: 22, targetPort: 2222, nodePort: 30022 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gitea
  namespace: gitea
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [git.sachaguerin.fr]
      secretName: gitea-tls
  rules:
    - host: git.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: gitea, port: { number: 80 } }