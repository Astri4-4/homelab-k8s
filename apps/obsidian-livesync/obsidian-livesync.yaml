apiVersion: v1
kind: Namespace
metadata:
  name: obsidian-livesync
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: couchdb-config
  namespace: obsidian-livesync
data:
  livesync.ini: |
    [couchdb]
    single_node = true
    max_document_size = 50000000

    [chttpd]
    require_valid_user = true
    max_http_request_size = 4294967296
    enable_cors = true

    [chttpd_auth]
    require_valid_user = true
    authentication_redirect = /_utils/session.html

    [httpd]
    WWW-Authenticate = Basic realm="couchdb"
    enable_cors = true

    [cors]
    origins = app://obsidian.md,capacitor://localhost,http://localhost
    credentials = true
    headers = accept, authorization, content-type, origin, referer
    methods = GET, PUT, POST, HEAD, DELETE
    max_age = 3600
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: couchdb-data
  namespace: obsidian-livesync
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: obsidian-livesync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      initContainers:
        - name: copy-config
          image: busybox:1.36
          command: ["sh", "-c", "cp /config/*.ini /local.d/"]
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: local-d, mountPath: /local.d }
      containers:
        - name: couchdb
          image: couchdb:3.4
          ports:
            - containerPort: 5984
          env:
            - name: COUCHDB_USER
              valueFrom: { secretKeyRef: { name: couchdb-admin, key: username } }
            - name: COUCHDB_PASSWORD
              valueFrom: { secretKeyRef: { name: couchdb-admin, key: password } }
          volumeMounts:
            - { name: data, mountPath: /opt/couchdb/data }
            - { name: local-d, mountPath: /opt/couchdb/etc/local.d }
          readinessProbe:
            tcpSocket: { port: 5984 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5984 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: couchdb-data }
        - name: config
          configMap: { name: couchdb-config }
        - name: local-d
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: couchdb
  namespace: obsidian-livesync
spec:
  selector:
    app: couchdb
  ports:
    - port: 5984
      targetPort: 5984
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: couchdb
  namespace: obsidian-livesync
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [obsidian.sachaguerin.fr]
      secretName: obsidian-livesync-tls
  rules:
    - host: obsidian.sachaguerin.fr
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: couchdb
                port:
                  number: 5984
