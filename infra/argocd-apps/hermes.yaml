apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <your homelab-k8s repo URL>
    targetRevision: master
    path: apps/hermes
  destination:
    server: https://kubernetes.default.svc
    namespace: hermes
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
