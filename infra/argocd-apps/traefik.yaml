apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 37.1.1   # vérifie la dernière : helm search repo traefik/traefik
    helm:
      valuesObject:
        deployment:
          kind: Deployment
          replicas: 1
        hostNetwork: true
        nodeSelector:
          kubernetes.io/hostname: talosnode1
        updateStrategy:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 1
            maxSurge: 0
        ports:
          web:
            port: 80
          websecure:
            port: 443
          traefik:
            port: 9000
          metrics:
            port: 9101
        metrics:
          prometheus:
            entryPoint: metrics
            addEntryPointsLabels: true
            addRoutersLabels: true
            addServicesLabels: true
            service:
              enabled: true
            serviceMonitor:
              enabled: true
              interval: 30s
        securityContext:
          capabilities:
            drop: [ALL]
            add: [NET_BIND_SERVICE]
          readOnlyRootFilesystem: true
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
        service:
          type: ClusterIP
        ingressClass:
          enabled: true
          isDefaultClass: true
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged