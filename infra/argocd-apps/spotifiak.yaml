apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spotifiak
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Astri4-4/homelab-k8s.git
    targetRevision: master
    path: apps/spotifiak
  destination:
    server: https://kubernetes.default.svc
    namespace: spotifiak
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
