apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: adguard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Astri4-4/homelab-k8s.git
    targetRevision: HEAD
    path: apps/adguard
  destination:
    server: https://kubernetes.default.svc
    namespace: dns
  syncPolicy:
    automated: { prune: true, selfHeal: true }