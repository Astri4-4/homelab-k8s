apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/astri4-4/homelab-k8s.git
    targetRevision: master
    path: apps/sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated: { prune: true, selfHeal: true }