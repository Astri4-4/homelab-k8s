apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spotifion
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/astri4-4/homelab-k8s.git
    targetRevision: master
    path: apps/spotifion
  destination:
    server: https://kubernetes.default.svc
    namespace: spotifion
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true