name: atm10-image

on:
  push:
    branches: [master]
    paths:
      - 'docker/atm10/**'
      - '.github/workflows/atm10.yml'
  workflow_dispatch:

env:
  # Pour changer de version : mettre a jour ces deux lignes, puis le tag image
  # dans apps/minecraft-atm10/atm10.yaml. L'ID du fichier se lit dans l'URL
  # CurseForge du Server Pack : .../files/8764245 -> /files/8764/245/
  PACK_VERSION: "8.1"
  PACK_URL: "https://mediafilez.forgecdn.net/files/8764/245/ServerFiles-8.1.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: docker/atm10
          push: true
          provenance: false
          build-args: |
            PACK_URL=${{ env.PACK_URL }}
            PACK_VERSION=${{ env.PACK_VERSION }}
          tags: |
            ghcr.io/astri4-4/atm10:${{ env.PACK_VERSION }}
            ghcr.io/astri4-4/atm10:latest
